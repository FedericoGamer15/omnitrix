<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix 3D Clásico Mejorado - Ben 10</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            background: radial-gradient(circle at center, #1a2a1a 0%, #000000 100%);
            font-family: 'Courier New', Courier, monospace;
            color: white;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1; 
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        h1 {
            margin: 0;
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }
        p {
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #39ff14;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
            width: max-content;
            max-width: 95vw;
            z-index: 10;
        }
        button, .upload-btn {
            background-color: #111;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            font-family: 'Courier New', Courier, monospace;
            display: inline-block;
        }
        button:hover, .upload-btn:hover {
            background-color: #39ff14;
            color: #000;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
        }
        button:active, .upload-btn:active {
            transform: scale(0.95);
        }
        
        input[type="file"] {
            display: none;
        }
        
        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #39ff14;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
        .alien-name {
            position: absolute;
            top: 130px;
            font-size: 28px;
            color: #39ff14;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 20px #39ff14;
            letter-spacing: 2px;
        }
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: auto;
            z-index: 20;
        }
        
        #credits-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        #credits-btn {
            background-color: #111;
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s;
        }
        #credits-btn:hover {
            background-color: #39ff14;
            color: #000;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }
        #credits-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #39ff14;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: right;
            display: none;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            color: white;
        }
        #credits-panel.show {
            display: block !important;
            animation: fadeIn 0.3s ease;
        }
        #credits-panel a {
            color: #39ff14;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 8px;
        }
        #credits-panel a:hover {
            text-decoration: underline;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #landscape-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 5, 5, 0.95);
            z-index: 999999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            color: #39ff14;
            pointer-events: all;
        }
        #landscape-warning h2 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #39ff14;
            text-transform: uppercase;
        }
        #landscape-warning p {
            font-size: 16px;
            background: none;
            border: none;
            max-width: 80%;
        }
        .rotate-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
            display: inline-block;
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) and (max-width: 800px) {
            #landscape-warning {
                display: flex;
            }
        }

        #intro-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 2000000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: none; 
        }
        #btn-start-experience {
            background-color: #111;
            color: #39ff14;
            border: 3px solid #39ff14;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            transition: transform 0.2s, background-color 0.2s;
        }
        #btn-start-experience:hover {
            background-color: #39ff14;
            color: #000;
        }
        #btn-start-experience:active {
            transform: scale(0.95);
        }
        #btn-skip-video {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background-color: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: none; 
            z-index: 2000001;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }
        #btn-skip-video:hover {
            background-color: rgba(57, 255, 20, 0.3);
            color: #39ff14;
            border-color: #39ff14;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="intro-video-container">
        <button id="btn-start-experience">INICIAR EXPERIENCIA</button>
        <video id="intro-video" playsinline></video>
        <button id="btn-skip-video">Saltar ⏭</button>
    </div>

    <div id="landscape-warning">
        <div class="rotate-icon">📱</div>
        <h2>¡Gira tu celular!</h2>
        <p>Para disfrutar al máximo del Omnitrix, por favor pon tu dispositivo en modo horizontal.</p>
    </div>

    <div id="ui-overlay">
        <h1>Omnitrix Clásico</h1>
        <p>Gira la cámara en 360° con el ratón/dedo.</p>
        <div id="alien-name" class="alien-name">FUEGO</div>
    </div>

    <div class="controls" id="controls">
        <button id="btn-left">◀ Alien</button>
        <button id="btn-action">Activar</button>
        <button id="btn-right">Alien ▶</button>
    </div>

    <div id="credits-container" style="z-index: 9999;">
        <div id="credits-panel">
            Hecho por <strong>Federico Cámara</strong><br>
            <a href="https://github.com/FedericoGamer15/omnitrix" target="_blank">🔗 Ver en GitHub</a>
        </div>
        <button id="credits-btn" onclick="document.getElementById('credits-panel').classList.toggle('show'); event.stopPropagation();">[Creador]</button>
    </div>

    <div id="flash-overlay"></div>
    <div id="canvas-container"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // ==========================================
        // 🎬 CONFIGURACIÓN DE VIDEOS INICIALES 🎬
        // ==========================================
        const RutaVideoIntro = "cinematicas/ben-10-classic_intro.mp4"; 
        const RutaVideoObtencion = "cinematicas/ben-10-classic_obtain-the-omnitrix.mp4"; 

        const introContainer = document.getElementById('intro-video-container');
        const introVideo = document.getElementById('intro-video');
        const btnStartExp = document.getElementById('btn-start-experience');
        const btnSkipVideo = document.getElementById('btn-skip-video');
        let isFadingOut = false;

        function finalizarVideos() {
            if (isFadingOut) return;
            isFadingOut = true;
            btnSkipVideo.style.display = 'none'; 
            
            gsap.to(introContainer, {
                opacity: 0,
                duration: 1.5,
                ease: "power2.inOut",
                onComplete: () => {
                    introContainer.style.display = 'none';
                    if (introVideo) {
                        introVideo.pause(); 
                        introVideo.removeAttribute('src'); 
                        introVideo.load(); 
                        introVideo.remove(); 
                    }
                    camera.aspect = window.innerWidth / window.innerHeight; 
                    camera.updateProjectionMatrix(); 
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        }

        if (RutaVideoIntro && RutaVideoIntro.trim() !== "") {
            let videoActual = 1;

            btnStartExp.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume(); 
                btnStartExp.style.display = 'none'; 
                btnSkipVideo.style.display = 'block'; 
                introVideo.style.display = 'block'; 
                introVideo.src = RutaVideoIntro;
                introVideo.play().catch(e => {
                    console.log("Error al reproducir video:", e);
                    finalizarVideos(); 
                });
            });

            btnSkipVideo.addEventListener('click', () => {
                introVideo.dispatchEvent(new Event('ended'));
            });

            introVideo.addEventListener('ended', () => {
                if (videoActual === 1 && RutaVideoObtencion && RutaVideoObtencion.trim() !== "") {
                    videoActual = 2;
                    introVideo.src = RutaVideoObtencion;
                    introVideo.play().catch(e => {
                        console.log("Error al reproducir segundo video:", e);
                        finalizarVideos();
                    });
                } else {
                    finalizarVideos();
                }
            });
        } else {
            introContainer.style.display = 'none';
        }


        // ==========================================
        // ⚙️ CONFIGURACIÓN DE MODELO Y PANTALLA
        // ==========================================
        const RutaModeloGLB = "classic_omnitrix.glb"; 
        
        const AlturaPantallaAlien = 1.07; 
        const TamanoPantallaAlien = 0.50;  
        const OpacidadHolograma = 1;    

        const RutasAliens = [
            "aliens/256x256/fuego.png",         
            "aliens/256x256/bestia.png",        
            "aliens/256x256/diamante.png",      
            "aliens/256x256/xlr8.png",          
            "aliens/256x256/materia_gris.png",  
            "aliens/256x256/cuatro_brazos.png", 
            "aliens/256x256/insectoide.png",    
            "aliens/256x256/acuatico.png",      
            "aliens/256x256/ultra-t.png",       
            "aliens/256x256/fantasmatico.png"   
        ];

        const MisSonidos = {
            activar: "sonidos/omnitrix_activate.mp3", girarDial: "sonidos/omnitrix_girar-dial.mp3", transformacion: "sonidos/omnitrix_transform.mp3", desactivar: "sonidos/omnitrix_power-down.mp3", recarga: "sonidos/omnitrix_cargado.mp3", loopSeleccion: "sonidos/omnitrix_dial-loop.wav"
        };
        
        const audiosCargados = {};
        const audioBuffers = {}; 

        for (let clave in MisSonidos) {
            if (MisSonidos[clave]) {
                const audio = new Audio(MisSonidos[clave]);
                audio.preload = 'auto';
                if (clave === 'loopSeleccion') audio.loop = true;
                audiosCargados[clave] = audio;

                if (clave === 'loopSeleccion') {
                    fetch(MisSonidos[clave])
                        .then(response => response.arrayBuffer())
                        .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer))
                        .then(audioBuffer => {
                            audioBuffers[clave] = audioBuffer;
                        })
                        .catch(e => console.warn("Modo local detectado: Se usará el loop estándar de respaldo.", e));
                }
            }
        }

        let audioLoopRealBuffer = null;
        let audioLoopRealHTML = null;
        let nodoLoopSintetico = null;
        let isLooping = false;

        function detenerSonidoLoop() {
            if (audioLoopRealBuffer) {
                try { audioLoopRealBuffer.stop(); audioLoopRealBuffer.disconnect(); } catch(e) {}
                audioLoopRealBuffer = null;
            }
            if (audioLoopRealHTML) {
                audioLoopRealHTML.pause();
                audioLoopRealHTML.currentTime = 0;
                audioLoopRealHTML = null;
            }
            if (nodoLoopSintetico) {
                const now = audioCtx.currentTime;
                nodoLoopSintetico.gain.gain.linearRampToValueAtTime(0, now + 0.1);
                const oscToStop = nodoLoopSintetico.osc;
                setTimeout(() => { try { oscToStop.stop(); } catch(e){} }, 100);
                nodoLoopSintetico = null;
            }
            isLooping = false;
        }

        function reproducirSonido(tipo, callbackOnEnded = null) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (tipo === 'loopSeleccion') {
                if (audioBuffers[tipo]) {
                    audioLoopRealBuffer = audioCtx.createBufferSource();
                    audioLoopRealBuffer.buffer = audioBuffers[tipo];
                    audioLoopRealBuffer.loop = true;
                    audioLoopRealBuffer.connect(audioCtx.destination);
                    audioLoopRealBuffer.start(0);
                    return;
                } else if (audiosCargados[tipo]) {
                    audioLoopRealHTML = audiosCargados[tipo];
                    audioLoopRealHTML.currentTime = 0;
                    audioLoopRealHTML.play().catch(e => console.log("Error en respaldo:", e));
                    return;
                }
            }

            if (tipo !== 'loopSeleccion' && audiosCargados[tipo]) {
                const audio = audiosCargados[tipo];
                audio.currentTime = 0;
                
                if (callbackOnEnded) {
                    audio.onended = () => {
                        callbackOnEnded();
                        audio.onended = null;
                    };
                } else {
                    audio.onended = null;
                }

                audio.play().catch(e => { 
                    console.log("Error:", e);
                    if(callbackOnEnded) callbackOnEnded(); 
                });
                return;
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            let duration = 0;

            if (tipo === 'activar') {
                duration = 0.6;
                osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.4);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.1); gain.gain.linearRampToValueAtTime(0, now + duration);
            } else if (tipo === 'girarDial') {
                duration = 0.1;
                osc.type = 'sine'; osc.frequency.setValueAtTime(1400, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            } else if (tipo === 'transformacion') {
                duration = 1.5;
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(10, now + 1.5);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            } else if (tipo === 'desactivar') {
                duration = 0.8;
                osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + duration);
            } else if (tipo === 'recarga') {
                duration = 0.4;
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.1, now + 0.1); gain.gain.linearRampToValueAtTime(0, now + duration);
            } else if (tipo === 'loopSeleccion') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.05, now + 0.5);
                nodoLoopSintetico = { osc, gain };
            }

            osc.start(now); 
            if(duration > 0) osc.stop(now + duration);

            if (callbackOnEnded && duration > 0) {
                setTimeout(callbackOnEnded, duration * 1000);
            }
        }

        // ==========================================
        // TEXTURAS Y PANTALLA 2D
        // ==========================================
        const colorVerde = '#39ff14';
        const nombresAliens = ["FUEGO", "BESTIA", "DIAMANTE", "XLR8", "MATERIA GRIS", "CUATRO BRAZOS", "INSECTOIDE", "ACUÁTICO", "ULTRA-T", "FANTASMÁTICO"];

        const textureLoader = new THREE.TextureLoader();
        const texturasAliens = [];

        function crearHologramaFallback() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 256, 256); ctx.strokeStyle = colorVerde; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.translate(128, 128); 
            ctx.beginPath(); const puntas = 5 + Math.floor(Math.random()*5);
            for(let i=0; i<puntas; i++){ const angle = (i/puntas)*Math.PI*2; const r = 40+Math.random()*60; ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r); }
            ctx.closePath(); ctx.stroke(); ctx.shadowColor = colorVerde; ctx.shadowBlur = 20; ctx.stroke(); return new THREE.CanvasTexture(canvas);
        }

        for (let i = 0; i < 10; i++) {
            if (RutasAliens[i] && RutasAliens[i].trim() !== "") {
                const tex = textureLoader.load(RutasAliens[i]);
                tex.encoding = THREE.sRGBEncoding; 
                texturasAliens.push(tex);
            } else {
                texturasAliens.push(crearHologramaFallback());
            }
        }

        function crearTexturaReloj(colorDial) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, 512, 512);
            ctx.beginPath(); ctx.arc(256, 256, 230, 0, Math.PI * 2); ctx.fillStyle = colorDial; ctx.fill();
            ctx.fillStyle = '#111111';
            ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(210, 256); ctx.lineTo(30, 482); ctx.lineTo(0, 482); ctx.lineTo(0, 30); ctx.fill();
            ctx.beginPath(); ctx.moveTo(482, 30); ctx.lineTo(302, 256); ctx.lineTo(482, 482); ctx.lineTo(512, 482); ctx.lineTo(512, 30); ctx.fill();
            ctx.beginPath(); ctx.arc(256, 256, 230, 0, Math.PI * 2); ctx.strokeStyle = '#444'; ctx.lineWidth = 12; ctx.stroke();
            const tex = new THREE.CanvasTexture(canvas); tex.anisotropy = 16; return tex;
        }

        function crearTexturaCircuito() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 1024, 256);
            ctx.strokeStyle = colorVerde; ctx.lineWidth = 6; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
            for (let i = 0; i < 12; i++) {
                let x = i * 85;
                ctx.beginPath(); ctx.moveTo(x+20, 256); ctx.lineTo(x+20, 160); ctx.lineTo(x+50, 130); ctx.lineTo(x+50, 40); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x+70, 0); ctx.lineTo(x+70, 80); ctx.lineTo(x+40, 110); ctx.lineTo(x+40, 200); ctx.stroke();
                ctx.fillStyle = colorVerde;
                ctx.beginPath(); ctx.arc(x+50, 40, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+40, 200, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(x+10, 80, 25, 8); ctx.fillRect(x+18, 100, 8, 20);
            }
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; return tex;
        }

        const texRelojVerde = crearTexturaReloj(colorVerde); const texRelojRojo = crearTexturaReloj('#ff0000');
        const texCircuito = crearTexturaCircuito(); 

        // ==========================================
        // CONFIGURACIÓN THREE.JS
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        renderer.setClearColor(0x000000, 0); 
        
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 5; controls.maxDistance = 60;

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2); dirLight.position.set(15, 25, 15); dirLight.castShadow = true; scene.add(dirLight);
        const omniLight = new THREE.PointLight(0x39ff14, 0, 35); omniLight.position.set(0, 5, 0); scene.add(omniLight);

        // ==========================================
        // CREACIÓN DE LA PANTALLA 2D (Disco)
        // ==========================================
        const pantallaMat = new THREE.MeshBasicMaterial({ 
            map: texturasAliens[0], transparent: true, opacity: 0, 
            blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffffff 
        });
        const pantallaAlien = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), pantallaMat);
        pantallaAlien.rotation.x = -Math.PI / 2;
        // Rota la imagen 180 grados para que el alien aparezca derecho y no de cabeza
        pantallaAlien.rotation.z = Math.PI; 

        // ==========================================
        // GRUPOS Y MODELO PROCEDURAL
        // ==========================================
        const modeloPrincipalGroup = new THREE.Group();
        scene.add(modeloPrincipalGroup);
        const omnitrixProcedural = new THREE.Group();
        modeloPrincipalGroup.add(omnitrixProcedural);

        const matCuerpo = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.8, metalness: 0.2 });
        const matBaseReloj = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7, metalness: 0.4 });
        const matTubosBlancos = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.5, metalness: 0.1 });
        const matVerdeNeon = new THREE.MeshStandardMaterial({ color: 0x39ff14, emissive: 0x39ff14, emissiveIntensity: 0.5 });
        const matDialGris = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6, metalness: 0.5 });
        const matCoreLateral = new THREE.MeshStandardMaterial({ color: 0x111111, map: texCircuito, emissive: 0x39ff14, emissiveMap: texCircuito, emissiveIntensity: 1.5 });
        
        const pulsera = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.2, 9, 32), matCuerpo);
        pulsera.rotation.x = Math.PI / 2; pulsera.rotation.z = Math.PI / 2; pulsera.position.y = -3.8; omnitrixProcedural.add(pulsera);

        for (let j = -1; j <= 1; j += 2) {
            const tubo = new THREE.Mesh(new THREE.TorusGeometry(5.3, 0.7, 16, 64, Math.PI * 0.75), matTubosBlancos);
            tubo.rotation.x = Math.PI / 2; tubo.rotation.y = Math.PI / 2; tubo.position.set(j * 3.5, -4, 0); tubo.rotation.z = -Math.PI * 0.375;
            omnitrixProcedural.add(tubo);
            const tuboInf = tubo.clone(); tuboInf.rotation.z = Math.PI * 0.625; omnitrixProcedural.add(tuboInf);
        }

        const baseReloj = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.8, 1.2, 64), matBaseReloj); baseReloj.position.y = -0.5; omnitrixProcedural.add(baseReloj);
        const nucleoGroup = new THREE.Group(); nucleoGroup.position.y = 0.5; omnitrixProcedural.add(nucleoGroup);
        const cilindroNucleo = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 2.5, 64), [matCoreLateral, matBaseReloj, matBaseReloj]);
        cilindroNucleo.position.y = -0.8; nucleoGroup.add(cilindroNucleo);
        const dialGroup = new THREE.Group(); dialGroup.position.y = 0.5; nucleoGroup.add(dialGroup);
        const bisel = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.4, 32, 64), matDialGris); bisel.rotation.x = Math.PI / 2; dialGroup.add(bisel);

        for(let i = 0; i < 4; i++) {
            const nodo = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), matVerdeNeon);
            const ang = (Math.PI / 4) + (i * Math.PI / 2); nodo.position.set(Math.cos(ang) * 3.3, 0.2, Math.sin(ang) * 3.3); dialGroup.add(nodo);
        }

        const placaMat = new THREE.MeshBasicMaterial({ map: texRelojVerde });
        const placaFrontal = new THREE.Mesh(new THREE.CylinderGeometry(3.1, 3.1, 0.1, 64), placaMat);
        placaFrontal.position.y = 0.1; placaFrontal.rotation.y = Math.PI / 2; dialGroup.add(placaFrontal);

        pantallaAlien.position.y = 0.16; 
        dialGroup.add(pantallaAlien);

        // ==========================================
        // CARGA AUTOMÁTICA DE MODELO GLTF/GLB
        // ==========================================
        const loader = new THREE.GLTFLoader();
        let modeloUsuario = null;
        let dialUsuario = null;
        let discoDialUsuario = null;
        let relojArenaVerdeUsuario = null;
        let object16Usuario = null;
        let botonUsuario = null;
        let materialesDinamicos = []; 

        if (RutaModeloGLB && RutaModeloGLB.trim() !== "") {
            
            loader.load(RutaModeloGLB, function(gltf) {
                
                omnitrixProcedural.visible = false; 

                if (modeloUsuario) modeloPrincipalGroup.remove(modeloUsuario);
                
                modeloUsuario = gltf.scene;
                dialUsuario = null;
                discoDialUsuario = null;
                relojArenaVerdeUsuario = null;
                object16Usuario = null;
                botonUsuario = null;
                materialesDinamicos = []; 
                
                const box = new THREE.Box3().setFromObject(modeloUsuario);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                const scale = 15 / size; 
                modeloUsuario.scale.set(scale, scale, scale);
                modeloUsuario.position.sub(center.multiplyScalar(scale)); 

                modeloUsuario.traverse((child) => {
                    if (child.name) {
                        const nombre = child.name.toLowerCase();
                        
                        // Guardamos la base original de las piezas para saber desde donde suben y bajan
                        if (!dialUsuario && (nombre.includes('dial') || nombre.includes('nucleo')) && !nombre.includes('discos')) {
                            dialUsuario = child;
                            dialUsuario.userData.baseY = child.position.y;
                            dialUsuario.userData.elevatedY = child.position.y + 0.36; // Sube 0.36
                        }

                        if (!discoDialUsuario && nombre.includes('discos_dial')) {
                            discoDialUsuario = child;
                            discoDialUsuario.userData.baseY = child.position.y;
                            discoDialUsuario.userData.elevatedY = child.position.y + 0.36;
                        }

                        if (!relojArenaVerdeUsuario && nombre.includes('reloj_arena_verde')) {
                            relojArenaVerdeUsuario = child;
                            relojArenaVerdeUsuario.userData.baseY = child.position.y;
                            relojArenaVerdeUsuario.userData.elevatedY = child.position.y + 0.36;
                        }

                        if (!object16Usuario && nombre.includes('object_16')) {
                            object16Usuario = child;
                            object16Usuario.userData.baseY = child.position.y;
                            object16Usuario.userData.elevatedY = child.position.y + 0.36;
                        }
                        
                        if (!botonUsuario && nombre.includes('boton')) {
                            botonUsuario = child;
                            botonUsuario.userData.posInicial = botonUsuario.position.clone();
                        }
                    }

                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material) {
                            const mat = child.material;
                            const c = mat.color;
                            const e = mat.emissive;
                            
                            const esVerde = 
                                (c && c.g > c.r + 0.1 && c.g > c.b + 0.1) || 
                                (e && e.g > e.r + 0.1 && e.g > e.b + 0.1) || 
                                (mat.name && (mat.name.toLowerCase().includes('verd') || mat.name.toLowerCase().includes('green') || mat.name.toLowerCase().includes('glow') || mat.name.toLowerCase().includes('luz')));

                            if (esVerde) {
                                if (!materialesDinamicos.find(m => m.mat === mat)) {
                                    materialesDinamicos.push({
                                        mat: mat,
                                        origColor: c ? c.clone() : null,
                                        origEmissive: e ? e.clone() : null
                                    });
                                }
                            }
                        }
                    }
                });

                if (discoDialUsuario) {
                    discoDialUsuario.add(pantallaAlien);
                    pantallaAlien.position.set(0, AlturaPantallaAlien, 0);
                    pantallaAlien.scale.set(TamanoPantallaAlien, TamanoPantallaAlien, TamanoPantallaAlien);
                } else if (dialUsuario) {
                    dialUsuario.add(pantallaAlien);
                    pantallaAlien.position.set(0, AlturaPantallaAlien, 0);
                    pantallaAlien.scale.set(TamanoPantallaAlien, TamanoPantallaAlien, TamanoPantallaAlien);
                }

                modeloPrincipalGroup.add(modeloUsuario);
                console.log("✅ Modelo 3D cargado con éxito desde:", RutaModeloGLB);

            }, undefined, function(error) {
                console.error("❌ Error al cargar tu archivo .GLB:", error);
                omnitrixProcedural.visible = true;
            });
        }

        // ==========================================
        // MÁQUINA DE ESTADOS E INTERACCIÓN
        // ==========================================
        let estadoActual = 'INACTIVO'; 
        let alienSeleccionado = 0;
        let isAnimating = false;

        const btnAccion = document.getElementById('btn-action');
        const btnIzquierda = document.getElementById('btn-left');
        const btnDerecha = document.getElementById('btn-right');
        const flashOverlay = document.getElementById('flash-overlay');
        const textoAlien = document.getElementById('alien-name');

        function actualizarUI() {
            if (estadoActual === 'INACTIVO') {
                btnAccion.innerText = 'Activar';
                btnIzquierda.style.display = 'none'; btnDerecha.style.display = 'none'; textoAlien.style.opacity = 0;
            } else if (estadoActual === 'ACTIVO') {
                btnAccion.innerText = '¡Transformar!';
                btnIzquierda.style.display = 'block'; btnDerecha.style.display = 'block';
                textoAlien.innerText = nombresAliens[alienSeleccionado]; textoAlien.style.opacity = 1;
            } else {
                btnAccion.innerText = '...';
                btnIzquierda.style.display = 'none'; btnDerecha.style.display = 'none'; textoAlien.style.opacity = 0;
            }
        }

        function cambiarAlien(dir) {
            if (estadoActual !== 'ACTIVO' || isAnimating) return;
            reproducirSonido('girarDial');
            
            alienSeleccionado = (alienSeleccionado + dir + 10) % 10;
            textoAlien.innerText = nombresAliens[alienSeleccionado];

            isAnimating = true;
            gsap.to(dialGroup.rotation, { y: dialGroup.rotation.y + (dir * Math.PI / 5), duration: 0.3, ease: "power2.out", onComplete: () => { isAnimating = false; }});

            if(modeloUsuario && dialUsuario) {
                // SOLAMENTE giramos el dial de la tuerca exterior. Las piezas internas ya no giran en absoluto.
                gsap.to(dialUsuario.rotation, { y: dialUsuario.rotation.y + (dir * Math.PI / 5), duration: 0.3, ease: "power2.out" });
            }

            gsap.to(pantallaMat, { opacity: 0, duration: 0.15, yoyo: true, repeat: 1, onRepeat: () => { pantallaMat.map = texturasAliens[alienSeleccionado]; }, onComplete: () => { pantallaMat.opacity = OpacidadHolograma; }});
        }

        function toggleOmnitrix() {
            if (isAnimating) return;

            if (estadoActual === 'INACTIVO') {
                isAnimating = true;
                reproducirSonido('activar');

                if (!isLooping) {
                    reproducirSonido('loopSeleccion');
                    isLooping = true;
                }
                
                gsap.to(nucleoGroup.position, { y: 2.5, duration: 0.5, ease: "back.out(1.5)" });
                
                if(modeloUsuario) {
                    if (botonUsuario) {
                        gsap.to(botonUsuario.position, {
                            x: botonUsuario.userData.posInicial.x + 0.03,
                            y: botonUsuario.userData.posInicial.y - 0.03,
                            z: botonUsuario.userData.posInicial.z - 0.03,
                            duration: 0.1,
                            yoyo: true, 
                            repeat: 1
                        });
                    }

                    // Subimos las 4 piezas de forma totalmente independiente a la misma altura
                    if (dialUsuario) {
                        gsap.to(dialUsuario.position, { y: dialUsuario.userData.elevatedY, duration: 0.5, delay: 0.1, ease: "back.out(1.5)" });
                    }
                    if (discoDialUsuario) {
                        gsap.to(discoDialUsuario.position, { y: discoDialUsuario.userData.elevatedY, duration: 0.5, delay: 0.1, ease: "back.out(1.5)" });
                    }
                    if (relojArenaVerdeUsuario) {
                        gsap.to(relojArenaVerdeUsuario.position, { y: relojArenaVerdeUsuario.userData.elevatedY, duration: 0.5, delay: 0.1, ease: "back.out(1.5)" });
                    }
                    if (object16Usuario) {
                        gsap.to(object16Usuario.position, { y: object16Usuario.userData.elevatedY, duration: 0.5, delay: 0.1, ease: "back.out(1.5)" });
                    }
                }

                gsap.to(omniLight, { intensity: 1.5, duration: 0.5 });
                gsap.to(pantallaMat, { opacity: OpacidadHolograma, duration: 0.5, delay: 0.2, onComplete: () => { estadoActual = 'ACTIVO'; isAnimating = false; actualizarUI(); }});

            } else if (estadoActual === 'ACTIVO') {
                isAnimating = true;
                estadoActual = 'TRANSFORMADO';
                
                detenerSonidoLoop();
                actualizarUI();
                reproducirSonido('transformacion');

                gsap.to(nucleoGroup.position, { y: 0.5, duration: 0.15, ease: "power4.in" });
                
                if(modeloUsuario) {
                    // Bajamos todas las piezas a su punto inicial
                    if (dialUsuario) gsap.to(dialUsuario.position, { y: dialUsuario.userData.baseY, duration: 0.15, ease: "power4.in", onComplete: () => { pantallaMat.opacity = 0; } });
                    if (discoDialUsuario) gsap.to(discoDialUsuario.position, { y: discoDialUsuario.userData.baseY, duration: 0.15, ease: "power4.in" });
                    if (relojArenaVerdeUsuario) gsap.to(relojArenaVerdeUsuario.position, { y: relojArenaVerdeUsuario.userData.baseY, duration: 0.15, ease: "power4.in" });
                    if (object16Usuario) gsap.to(object16Usuario.position, { y: object16Usuario.userData.baseY, duration: 0.15, ease: "power4.in" });
                } else {
                    setTimeout(() => { pantallaMat.opacity = 0; }, 150);
                }

                flashOverlay.style.backgroundColor = '#39ff14';
                flashOverlay.style.opacity = 1;
                gsap.to(flashOverlay, { opacity: 0, duration: 1.5, delay: 0.15, ease: "power2.out" });
                
                omniLight.color.setHex(0x39ff14);
                omniLight.intensity = 15;
                gsap.to(omniLight, { intensity: 0, duration: 1.5, delay: 0.15 });

                setTimeout(iniciarRecarga, 5000); 
            }
        }

        function iniciarRecarga() {
            estadoActual = 'RECARGA'; 
            pantallaMat.opacity = 0; 
            
            placaMat.map = texRelojRojo; matVerdeNeon.color.setHex(0xff0000); matVerdeNeon.emissive.setHex(0xff0000);
            matCoreLateral.emissive.setHex(0xff0000); 

            flashOverlay.style.backgroundColor = '#ff0000';
            flashOverlay.style.opacity = 1;
            gsap.to(flashOverlay, { opacity: 0, duration: 1.5, delay: 0.1, ease: "power2.out" });
            
            omniLight.color.setHex(0xff0000);
            omniLight.intensity = 15;
            gsap.to(omniLight, { intensity: 0, duration: 1.5 });

            materialesDinamicos.forEach(m => {
                if (m.mat.color) m.mat.color.setHex(0xff0000);
                if (m.mat.emissive) m.mat.emissive.setHex(0xff0000);
            });

            reproducirSonido('desactivar', () => {
                setTimeout(() => {
                    reproducirSonido('recarga', () => {
                        estadoActual = 'INACTIVO';
                        placaMat.map = texRelojVerde; matVerdeNeon.color.setHex(0x39ff14); matVerdeNeon.emissive.setHex(0x39ff14);
                        matCoreLateral.emissive.setHex(0x39ff14); omniLight.color.setHex(0x39ff14); flashOverlay.style.backgroundColor = '#39ff14';
                        
                        materialesDinamicos.forEach(m => {
                            if (m.origColor && m.mat.color) m.mat.color.copy(m.origColor);
                            if (m.origEmissive && m.mat.emissive) m.mat.emissive.copy(m.origEmissive);
                        });

                        isAnimating = false; actualizarUI();
                    });
                }, 2000);
            });
        }

        btnAccion.addEventListener('click', toggleOmnitrix);
        btnIzquierda.addEventListener('click', () => cambiarAlien(-1));
        btnDerecha.addEventListener('click', () => cambiarAlien(1));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL' || e.target.tagName === 'INPUT') return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(modeloPrincipalGroup.children, true);
            if (intersects.length > 0) {
                let clicValido = false;

                if (modeloUsuario) {
                    let tocoBoton = false;
                    let tocoDial = false;
                    
                    intersects.forEach(intersect => {
                        let obj = intersect.object;
                        while(obj) {
                            if (botonUsuario && obj === botonUsuario) tocoBoton = true;
                            if (dialUsuario && obj === dialUsuario) tocoDial = true;
                            if (discoDialUsuario && obj === discoDialUsuario) tocoDial = true;
                            if (relojArenaVerdeUsuario && obj === relojArenaVerdeUsuario) tocoDial = true;
                            if (object16Usuario && obj === object16Usuario) tocoDial = true;
                            obj = obj.parent;
                        }
                    });

                    if (estadoActual === 'INACTIVO') {
                        clicValido = botonUsuario ? tocoBoton : true;
                    } else if (estadoActual === 'ACTIVO') {
                        clicValido = dialUsuario ? tocoDial : true;
                    }

                } else {
                    clicValido = true; 
                }

                if (clicValido && (estadoActual === 'INACTIVO' || estadoActual === 'ACTIVO')) {
                    toggleOmnitrix();
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
        actualizarUI();

        function animate() {
            requestAnimationFrame(animate); controls.update();
            if(estadoActual === 'ACTIVO') {
                texCircuito.offset.x -= 0.002;
            }
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
